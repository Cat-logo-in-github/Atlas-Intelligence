[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"


[project]
name = "atlas-intelligence"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "typer>=0.27",
    "pyyaml>=6.0",
    "rich>=15.0",
    "requests>=2.34",
    "beautifulsoup4>=4.15",
    "markdownify>=1.2",
    "playwright>=1.61",
    "numpy>=2.5",
    "pandas>=3.0",
    "matplotlib>=3.11",
    "plotly>=6.9",
    "kaleido>=1.3",
    "networkx>=3.6",
    "sympy>=1.14"
]


[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "ruff"
]

notebooks = [
    "jupyterlab",
    "nbconvert"
]


[project.scripts]
atlas = "atlas.cli:main"


[tool.setuptools.packages.find]
include = ["atlas*"]